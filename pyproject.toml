[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whisper-doped"
version = "0.2.0"
description = "Local, private dictation for macOS and Linux, modelled on Wispr Flow"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["dictation", "speech-to-text", "whisper", "macos", "linux", "offline"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "numpy>=1.26",
    "sounddevice>=0.4.6",   # microphone capture (PortAudio)
    "pynput>=1.7.6",        # global hotkey (needs Accessibility permission)
]

[project.optional-dependencies]
# Local speech-to-text backends (pick one; mlx is fastest on Apple Silicon)
mlx = ["mlx-whisper>=0.4.2"]
whispercpp = ["pywhispercpp>=1.2.0"]
fasterwhisper = ["faster-whisper>=0.10.0"]

# macOS menu bar + Accessibility insertion + clipboard/Cmd+V
macos = [
    "rumps>=0.4.0",
    "pyobjc-framework-Cocoa>=10.3",
    "pyobjc-framework-Quartz>=10.3",
    "pyobjc-framework-ApplicationServices>=10.3",
]

# Optional: decode more audio formats when transcribing files (mp3, m4a, ...)
audio = ["soundfile>=0.12"]

all = [
    "mlx-whisper>=0.4.2",
    "pywhispercpp>=1.2.0",
    "faster-whisper>=0.10.0",
    "rumps>=0.4.0",
    "pyobjc-framework-Cocoa>=10.3",
    "pyobjc-framework-Quartz>=10.3",
    "pyobjc-framework-ApplicationServices>=10.3",
    "soundfile>=0.12",
]

[project.scripts]
whisper-doped = "whisper_doped.cli:main"
whisper_doped = "whisper_doped.cli:main"

[tool.setuptools.packages.find]
include = ["whisper_doped*"]